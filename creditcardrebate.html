<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信用卡戰略</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        -webkit-tap-highlight-color: transparent;
        body { padding-top: env(safe-area-inset-top); background: #f8fafc; }
    </style>
</head>
<body class="pb-20">
    <div class="max-w-md mx-auto px-4">
        <div class="flex justify-between items-center py-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">簽賬戰略 <span class="text-blue-500">2.0</span></h1>
                <p class="text-sm text-slate-500" id="currentDateDisplay"></p>
            </div>
            <button onclick="location.reload()" class="p-2 bg-white rounded-full shadow-sm"><i class="fa-solid fa-rotate"></i></button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <div class="mb-4">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">打算簽幾多? (HKD)</label>
                <input type="number" id="amt" inputmode="decimal" class="w-full text-4xl font-bold text-slate-800 border-b-2 border-slate-100 focus:border-blue-500 outline-none py-2" placeholder="0">
            </div>
            <div class="mb-6">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">消費類別</label>
                <select id="cat" class="w-full mt-2 p-3 bg-slate-50 rounded-xl font-medium text-slate-700 outline-none border-none">
                    <option value="online">網上購物 (Online)</option>
                    <option value="japan">日本實體店 (Japan)</option>
                    <option value="overseas">海外實體店 (Overseas)</option>
                    <option value="dining">本地食肆 (Dining)</option>
                    <option value="mobile">手機支付 (Mobile Pay)</option>
                    <option value="local">一般本地實體 (Local)</option>
                </select>
            </div>
            <button onclick="suggestBest()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">即時分析最抵卡</button>
        </div>

        <div id="resultModal" class="hidden bg-blue-50 border-2 border-blue-200 p-5 rounded-2xl mb-6 relative animate-bounce">
            <div class="flex items-start">
                <div class="bg-blue-600 text-white p-3 rounded-lg mr-4"><i class="fa-solid fa-star"></i></div>
                <div class="flex-1">
                    <h2 class="font-bold text-blue-900" id="recName">--</h2>
                    <p class="text-sm text-blue-700" id="recReason">--</p>
                    <div class="mt-3 flex gap-2">
                        <button onclick="confirmTransaction()" class="bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-bold">確認已簽賬</button>
                        <button onclick="closeResult()" class="bg-slate-200 text-slate-600 text-xs px-4 py-2 rounded-lg">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="font-bold text-slate-800 mb-4 px-1">信用卡餘額總覽</h3>
        <div id="cardList" class="space-y-3"></div>

        <button onclick="clearData()" class="w-full mt-10 text-xs text-slate-300 font-medium pb-10">重設所有本地紀錄</button>
    </div>

    <script>
        // 設定今日日期
        const today = new Date(); // 實際使用會用系統時間
        document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString();

        // 卡片規則引擎
        let cards = {
            hsbc_red: { name: "HSBC Red", cap: 10000, spent: 0, rate: 0.04, cats: ['online'] },
            boc_chill: { name: "BOC Chill", cap: 3260, spent: 0, rate: 0.05, cats: ['online', 'overseas', 'japan'] },
            boc_sogo: { name: "BOC Sogo Visa", cap: 2000, spent: 0, rate: 0.054, cats: ['mobile'] },
            aeon_waku: { name: "Aeon Wakuwaku", cap: 3571, spent: 3508.49, rate: 0.06, cats: ['online', 'japan'], cycle: 8 },
            sim_world: { name: "Sim World", cap: 2500, spent: 0, rate: 0.08, cats: ['overseas', 'japan'], threshold: 1000, nonOnlineSpent: 0 },
            imotion: { name: "中信 i-Motion", cap: 3800, spent: 0, rate: 0.0526, cats: ['online', 'dining'], threshold: 3800 }
        };

        let lastRec = null;

        function load() {
            const data = localStorage.getItem('credit_card_data');
            if (data) {
                const saved = JSON.parse(data);
                Object.keys(cards).forEach(k => { if(saved[k]) cards[k].spent = saved[k]; });
            }
            render();
        }

        function render() {
            const list = document.getElementById('cardList');
            list.innerHTML = '';
            Object.keys(cards).forEach(k => {
                const card = cards[k];
                const remain = Math.max(0, card.cap - card.spent).toFixed(0);
                const progress = Math.min(100, (card.spent / card.cap) * 100);
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-slate-50">
                        <div class="flex-1">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-slate-700 text-sm">${card.name}</span>
                                <span class="text-xs text-slate-400">剩 $${remain}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-blue-500 h-full" style="width: ${progress}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function suggestBest() {
            const amt = parseFloat(document.getElementById('amt').value);
            const cat = document.getElementById('cat').value;
            if(!amt) return;

            let best = null;
            let maxRebate = -1;

            Object.keys(cards).forEach(k => {
                const c = cards[k];
                if (!c.cats.includes(cat) && cat !== 'local') return;

                let rate = 0.004; // 基本
                if (c.cats.includes(cat) && c.spent < c.cap) {
                    rate = c.rate;
                    // 特殊規則
                    if (k === 'sim_world' && (c.nonOnlineSpent + (cat!=='online'?amt:0) < 1000)) rate = 0.004;
                    if (k === 'imotion' && (c.spent + amt < 3800)) rate = 0.004;
                }

                if (rate > maxRebate) {
                    maxRebate = rate;
                    best = k;
                }
            });

            lastRec = { key: best, amount: amt, cat: cat };
            document.getElementById('recName').innerText = `${cards[best].name}`;
            document.getElementById('recReason').innerText = `預計回贈 ${(maxRebate*100).toFixed(1)}%。簽完呢筆仲剩 $${(cards[best].cap - cards[best].spent - amt).toFixed(0)} 額度。`;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function confirmTransaction() {
            const c = cards[lastRec.key];
            c.spent += lastRec.amount;
            if (lastRec.cat !== 'online') {
                if(c.nonOnlineSpent !== undefined) c.nonOnlineSpent += lastRec.amount;
            }
            localStorage.setItem('credit_card_data', JSON.stringify(Object.keys(cards).reduce((acc, k) => ({...acc, [k]: cards[k].spent}), {})));
            render();
            closeResult();
            document.getElementById('amt').value = '';
        }

        function closeResult() { document.getElementById('resultModal').classList.add('hidden'); }
        function clearData() { if(confirm('清除所有數據?')) { localStorage.removeItem('credit_card_data'); location.reload(); } }

        load();
    </script>
</body>
</html>
