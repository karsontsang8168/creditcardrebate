<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信用卡戰略 3.3</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 pb-32">
    <div class="max-w-md mx-auto px-4">
        <div class="flex justify-between items-center py-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">簽賬戰略 <span class="text-blue-600">3.3</span></h1>
                <p class="text-[10px] text-slate-400 font-medium">Shared Rebate Pool Architecture</p>
            </div>
            <button onclick="undoLast()" id="undoBtn" class="hidden p-2 bg-orange-100 text-orange-600 rounded-lg shadow-sm text-xs px-4 font-bold active:scale-95 transition">
                <i class="fa-solid fa-rotate-left mr-1"></i> 撤銷
            </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6">
            <div class="mb-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">金額 (HKD)</label>
                <input type="number" id="amt" inputmode="decimal" class="w-full text-4xl font-black text-slate-800 border-b-2 border-slate-100 focus:border-blue-500 outline-none py-2" placeholder="0">
            </div>
            <div class="mb-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">商戶類別</label>
                <select id="cat" class="w-full mt-2 p-3 bg-slate-50 rounded-2xl font-bold text-slate-700 outline-none">
                    <option value="dining_local">本地食肆 (HKD)</option>
                    <option value="local_phys">一般本地實體店 (HKD)</option>
                    <option value="online_fc">外幣網購 (Online FC)</option>
                    <option value="online_hkd">港幣網購 (Online HKD)</option>
                    <option value="japan_phys">日本實體店 (JPY 拍卡)</option>
                    <option value="overseas_phys">外幣實體店 (非 JPY 拍卡)</option>
                </select>
            </div>
            
            <div class="mb-6 bg-blue-50 p-4 rounded-2xl border border-blue-100 flex items-center justify-between">
                <div onclick="document.getElementById('isMobilePay').click()" class="cursor-pointer">
                    <span class="text-sm font-bold text-blue-900 block">Samsung/Apple Pay?</span>
                    <span class="text-[10px] text-blue-500 font-medium">啟動 Sogo Visa 5.4%</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="isMobilePay" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <button onclick="suggestBest()" class="w-full bg-slate-800 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all">分析最佳戰略</button>
        </div>

        <div id="resultArea" class="hidden mb-8">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 px-1">💡 推薦排行 (請點選)</h3>
            <div id="recommendations" class="space-y-3"></div>
            <div id="confirmActionDiv" class="hidden mt-4">
                <button id="finalConfirmBtn" onclick="executeTransaction()" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition animate-pulse">確認簽賬</button>
            </div>
        </div>

        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-1">限額消耗進度</h3>
        <div id="cardList" class="space-y-4"></div>
        
        <div class="mt-12 pt-8 border-t-2 border-slate-100 space-y-4">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">週期管理</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="resetGroup('monthly')" class="bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 rounded-2xl text-xs active:bg-slate-100 transition shadow-sm">
                    重設 1 號週期<br><span class="text-[9px] font-normal text-slate-400">(BOC/HSBC/中信)</span>
                </button>
                <button onclick="resetGroup('aeon')" class="bg-white border-2 border-blue-200 text-blue-700 font-bold py-3 rounded-2xl text-xs active:bg-blue-50 transition shadow-sm">
                    重設 AEON (8 號)<br><span class="text-[9px] font-normal text-blue-400">(Wakuwaku)</span>
                </button>
            </div>
            <button onclick="clearAllData()" class="w-full text-[10px] text-slate-300 font-bold pt-4 underline uppercase tracking-widest text-center">清空全部數據 (Emergency Reset)</button>
        </div>
    </div>

    <script>
        let cards = {
            hsbc_red: { name: "HSBC Red", cap: 10000, spent: 0, group: 'monthly', rates: { online_hkd: 0.04, online_fc: 0.04 } },
            boc_chill: { name: "BOC Chill", cap: 3260, spent: 0, group: 'monthly', rates: { online_hkd: 0.05, online_fc: 0.05, japan_phys: 0.05, overseas_phys: 0.05 } },
            boc_sogo: { name: "BOC Sogo Visa", cap: 2000, spent: 0, group: 'monthly', rates: {} }, 
            
            // 3.3 改動：AEON 加入 shared_rebate_cap (200蚊回贈池)
            aeon_waku: { name: "Aeon Wakuwaku", cap: Infinity, spent: 0, group: 'aeon', shared_rebate_cap: 200, rebate_used: 0, rates: { online_hkd: 0.06, online_fc: 0.06, japan_phys: 0.03 } },
            
            sim_world: { name: "Sim World", cap: 2500, spent: 0, group: 'monthly', threshold: 1000, nonOnlineSpent: 0, rates: { japan_phys: 0.08, overseas_phys: 0.08 } },
            imotion: { name: "中信 i-Motion", cap: 3800, spent: 0, group: 'monthly', threshold: 3800, rates: { online_hkd: 0.0526, online_fc: 0.0526, dining_local: 0.0526 } },
            citi_cb: { name: "Citi Cash Back", cap: Infinity, spent: 0, hidden: true, rates: { dining_local: 0.02, online_fc: 0.02, japan_phys: 0.02, overseas_phys: 0.02, default: 0.01 } },
            sc_simply: { name: "SC Simply Cash", cap: Infinity, spent: 0, hidden: true, rates: { online_fc: 0.02, japan_phys: 0.02, overseas_phys: 0.02, default: 0.015 } }
        };

        let history = [];
        let pendingTx = null;

        function load() {
            const data = localStorage.getItem('cc_strategy_v3.3');
            if (data) {
                const saved = JSON.parse(data);
                Object.keys(cards).forEach(k => { 
                    if(saved.cards[k]) cards[k].spent = saved.cards[k]; 
                    if(saved.cards[k+'_non']) cards[k].nonOnlineSpent = saved.cards[k+'_non']; 
                    if(cards[k].shared_rebate_cap && saved.cards[k+'_rebate'] !== undefined) cards[k].rebate_used = saved.cards[k+'_rebate'];
                });
                history = saved.history || [];
            }
            render(); updateUndoBtn();
        }

        function render() {
            const list = document.getElementById('cardList');
            list.innerHTML = '';
            Object.keys(cards).forEach(k => {
                if (cards[k].hidden) return;
                
                let remainText = '';
                let progress = 0;
                let barColor = '';
                let textColor = '';

                // 判斷係咪用「回贈池」模式 (AEON Wakuwaku)
                if (cards[k].shared_rebate_cap) {
                    let remainRebate = Math.max(0, cards[k].shared_rebate_cap - (cards[k].rebate_used || 0));
                    progress = Math.min(100, ((cards[k].rebate_used || 0) / cards[k].shared_rebate_cap) * 100);
                    remainText = `回贈限額剩 $${remainRebate.toFixed(1)}`;
                    barColor = remainRebate < 20 ? 'bg-red-500' : 'bg-purple-500'; // Wakuwaku 專屬紫色
                    textColor = remainRebate < 20 ? 'text-red-500' : 'text-purple-600';
                } else {
                    let remain = Math.max(0, cards[k].cap - cards[k].spent);
                    progress = Math.min(100, (cards[k].spent / cards[k].cap) * 100);
                    remainText = `簽賬限額剩 $${remain.toFixed(0)}`;
                    barColor = remain < 100 ? 'bg-red-500' : 'bg-blue-600';
                    textColor = remain < 100 ? 'text-red-500' : 'text-slate-500';
                }

                list.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-50">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-black text-slate-700 text-sm tracking-tight">${cards[k].name}</span>
                            <span class="text-[10px] font-bold ${textColor}">${remainText}</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden shadow-inner"><div class="${barColor} h-full transition-all duration-1000" style="width: ${progress}%"></div></div>
                    </div>`;
            });
        }

        function suggestBest() {
            const amtVal = document.getElementById('amt').value;
            if(!amtVal || parseFloat(amtVal) <= 0) { alert("⚠️ 請先輸入金額"); return; }
            const amt = parseFloat(amtVal);
            const cat = document.getElementById('cat').value;
            const isMobile = document.getElementById('isMobilePay').checked;

            pendingTx = null;
            document.getElementById('confirmActionDiv').classList.add('hidden');

            let allOptions = [];
            Object.keys(cards).forEach(k => {
                const c = cards[k];
                let rate = c.rates[cat] || c.rates['default'] || 0.004;
                let warning = '';
                
                if (k === 'boc_sogo' && isMobile && !cat.includes('online')) rate = 0.054;
                if (k === 'sim_world' && (c.nonOnlineSpent + (cat.includes('phys')||cat.includes('dining')?amt:0) < 1000)) warning = '⚠️需滿$1000';
                if (k === 'imotion' && (c.spent + amt < 3800)) warning = '⚠️需滿$3800';

                let remainCap = 0;
                
                // 動態換算限額 (Shared Rebate Pool Logic)
                if (c.shared_rebate_cap) {
                    let extraRate = rate - 0.004; // 銀行通常係用「額外回贈」去計嗰 200 蚊上限
                    if (extraRate > 0) {
                        let remainRebate = Math.max(0, c.shared_rebate_cap - (c.rebate_used || 0));
                        remainCap = remainRebate / extraRate; // 動態算出「喺呢個消費類別下，仲可以簽幾多錢」
                    } else {
                        remainCap = Infinity; // 如果只係0.4%，唔扣200蚊限額
                    }
                } else {
                    remainCap = Math.max(0, (c.cap || Infinity) - c.spent);
                }

                let rebate = (amt <= remainCap) ? (amt * rate) : (remainCap * rate + (amt - remainCap) * 0.004);
                allOptions.push({ key: k, rebate: rebate, rate: rate, remain: Math.max(0, remainCap - amt), warning: warning });
            });

            allOptions.sort((a, b) => b.rebate - a.rebate);
            const top3 = allOptions.slice(0, 3);

            const resDiv = document.getElementById('recommendations');
            resDiv.innerHTML = '';
            top3.forEach((opt, index) => {
                const remainText = opt.remain === Infinity ? '無上限' : '$' + opt.remain.toFixed(0);
                resDiv.innerHTML += `
                    <div id="card_${opt.key}" onclick="selectCard('${opt.key}', ${amt}, '${cat}')" class="bg-white p-4 rounded-2xl border-2 border-slate-100 cursor-pointer active:scale-95 transition-all shadow-sm">
                        <div class="flex justify-between items-center">
                            <div class="flex-1">
                                <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest" id="badge_${opt.key}">Rank ${index+1}</span>
                                <h4 class="font-black text-slate-800 text-sm leading-tight">${cards[opt.key].name} <span class="text-orange-500 text-[10px] ml-1">${opt.warning}</span></h4>
                                <p class="text-[10px] text-slate-500 mt-1">
                                    潛在利率: <span class="font-bold text-slate-700">${(opt.rate*100).toFixed(1)}%</span> | 
                                    ${cards[opt.key].shared_rebate_cap ? '動態' : '簽後'}餘額: <span class="font-bold text-slate-700">${remainText}</span>
                                </p>
                            </div>
                            <div class="text-right ml-2"><span class="text-xl font-black text-slate-900">$${opt.rebate.toFixed(1)}</span></div>
                        </div>
                    </div>`;
            });
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function selectCard(key, amount, cat) {
            pendingTx = { key, amount, cat };
            Object.keys(cards).forEach(k => {
                const el = document.getElementById('card_' + k);
                if(el) {
                    el.classList.toggle('border-blue-500', k === key);
                    el.classList.toggle('bg-blue-50', k === key);
                    el.classList.toggle('border-slate-100', k !== key);
                }
            });
            document.getElementById('finalConfirmBtn').innerText = `確認已簽 $${amount} (${cards[key].name})`;
            document.getElementById('confirmActionDiv').classList.remove('hidden');
        }

        function executeTransaction() {
            if (!pendingTx) return;
            const { key, amount, cat } = pendingTx;
            const nonOnlineAdd = (cat.includes('phys') || cat.includes('dining')) ? amount : 0;
            
            let addedRebate = 0;
            let rate = cards[key].rates[cat] || cards[key].rates['default'] || 0.004;
            if (key === 'boc_sogo' && document.getElementById('isMobilePay').checked && !cat.includes('online')) rate = 0.054;

            // 扣減 Wakuwaku 回贈池邏輯
            if (cards[key].shared_rebate_cap) {
                let extraRate = rate - 0.004;
                if (extraRate > 0) {
                    let remainRebate = Math.max(0, cards[key].shared_rebate_cap - (cards[key].rebate_used || 0));
                    addedRebate = (amount <= (remainRebate/extraRate)) ? (amount * extraRate) : remainRebate;
                    cards[key].rebate_used = (cards[key].rebate_used ||
