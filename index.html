<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信用卡戰略 2.7</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 pb-24">
    <div class="max-w-md mx-auto px-4">
        <div class="flex justify-between items-center py-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">簽賬戰略 <span class="text-blue-500">2.7</span></h1>
                <p class="text-[10px] text-slate-400">真實情況機制</p>
            </div>
            <div class="flex gap-2">
                <button onclick="undoLast()" id="undoBtn" class="hidden p-2 bg-orange-100 text-orange-600 rounded-full shadow-sm text-xs px-3 font-bold">撤銷</button>
                <button onclick="location.reload()" class="p-2 bg-white rounded-full shadow-sm"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <div class="mb-4">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">金額 (HKD)</label>
                <input type="number" id="amt" inputmode="decimal" class="w-full text-4xl font-bold text-slate-800 border-b-2 border-slate-100 focus:border-blue-500 outline-none py-2" placeholder="0">
            </div>
            <div class="mb-4">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">商戶類別</label>
                <select id="cat" class="w-full mt-2 p-3 bg-slate-50 rounded-xl font-medium text-slate-700 outline-none">
                    <option value="dining_local">本地食肆 (HKD)</option>
                    <option value="local_phys">一般本地實體店 (HKD)</option>
                    <option value="online_fc">外幣網購 (Online FC)</option>
                    <option value="online_hkd">港幣網購 (Online HKD)</option>
                    <option value="japan_phys">日本實體店 (JPY 拍卡)</option>
                    <option value="overseas_phys">外幣實體店 (非 JPY 拍卡)</option>
                </select>
            </div>
            
            <div class="mb-6 bg-blue-50 p-3 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                    <span class="text-sm font-bold text-blue-900 block">可用 Samsung/Apple Pay?</span>
                    <span class="text-[10px] text-blue-600">啟動 Sogo Visa 5.4% 計算</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="isMobilePay" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                </label>
            </div>

            <button onclick="suggestBest()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">分析所有選項</button>
        </div>

        <div id="resultArea" class="hidden mb-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">💡 推薦排行 (請先點選一張卡)</h3>
            <div id="recommendations" class="space-y-3"></div>
            
            <div id="confirmActionDiv" class="hidden mt-4">
                <button id="finalConfirmBtn" onclick="executeTransaction()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition animate-pulse">
                    確認寫入數據
                </button>
            </div>
        </div>

        <h3 class="font-bold text-slate-800 mb-4 px-1">信用卡餘額進度</h3>
        <div id="cardList" class="space-y-3"></div>
        <button onclick="clearData()" class="w-full mt-10 text-xs text-slate-300 font-medium pb-10 underline text-center">重設所有數據 (清零)</button>
    </div>

    <script>
        let cards = {
            hsbc_red: { name: "HSBC Red", cap: 10000, spent: 0, rates: { online_hkd: 0.04, online_fc: 0.04 } },
            boc_chill: { name: "BOC Chill", cap: 3260, spent: 0, rates: { online_hkd: 0.05, online_fc: 0.05, japan_phys: 0.05, overseas_phys: 0.05 } },
            boc_sogo: { name: "BOC Sogo Visa", cap: 2000, spent: 0, rates: {} }, 
            // Wakuwaku 初始值改回 0，真正淨空
            aeon_waku: { name: "Aeon Wakuwaku", cap: 3571, spent: 0, rates: { online_hkd: 0.06, online_fc: 0.06, japan_phys: 0.03 } },
            sim_world: { name: "Sim World", cap: 2500, spent: 0, threshold: 1000, nonOnlineSpent: 0, rates: { japan_phys: 0.08, overseas_phys: 0.08 } },
            imotion: { name: "中信 i-Motion", cap: 3800, spent: 0, threshold: 3800, rates: { online_hkd: 0.0526, online_fc: 0.0526, dining_local: 0.0526 } },
            citi_cb: { name: "Citi Cash Back", cap: Infinity, spent: 0, hidden: true, rates: { dining_local: 0.02, online_fc: 0.02, japan_phys: 0.02, overseas_phys: 0.02, default: 0.01 } },
            sc_simply: { name: "SC Simply Cash", cap: Infinity, spent: 0, hidden: true, rates: { online_fc: 0.02, japan_phys: 0.02, overseas_phys: 0.02, default: 0.015 } }
        };

        let history = [];
        let pendingTx = null;

        function load() {
            const data = localStorage.getItem('cc_strategy_v2.7');
            if (data) {
                const saved = JSON.parse(data);
                Object.keys(cards).forEach(k => { if(saved.cards[k]) cards[k].spent = saved.cards[k]; if(saved.cards[k+'_non']) cards[k].nonOnlineSpent = saved.cards[k+'_non']; });
                history = saved.history || [];
            }
            render(); updateUndoBtn();
        }

        function render() {
            const list = document.getElementById('cardList');
            list.innerHTML = '';
            Object.keys(cards).forEach(k => {
                if (cards[k].hidden) return;
                const remain = Math.max(0, cards[k].cap - cards[k].spent).toFixed(0);
                const progress = Math.min(100, (cards[k].spent / cards[k].cap) * 100);
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <div class="flex justify-between text-xs mb-1 font-bold text-slate-700">
                            <span>${cards[k].name}</span><span class="${remain < 100 ? 'text-red-500' : 'text-slate-400'}">剩 $${remain}</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div class="${remain < 100 ? 'bg-red-500' : 'bg-blue-500'} h-full" style="width: ${progress}%"></div></div>
                    </div>`;
            });
        }

        function suggestBest() {
            const amt = parseFloat(document.getElementById('amt').value);
            const cat = document.getElementById('cat').value;
            const isMobile = document.getElementById('isMobilePay').checked;
            if(!amt || amt <= 0) return;

            pendingTx = null;
            document.getElementById('confirmActionDiv').classList.add('hidden');

            let allOptions = [];
            Object.keys(cards).forEach(k => {
                const c = cards[k];
                const remainCap = Math.max(0, (c.cap || Infinity) - c.spent);
                let rate = c.rates[cat] || c.rates['default'] || 0.004;
                let warningMsg = '';
                
                if (k === 'boc_sogo' && isMobile && !cat.includes('online')) rate = 0.054;
                
                if (k === 'sim_world' && (c.nonOnlineSpent + (cat.includes('phys')||cat.includes('dining')?amt:0) < 1000)) {
                    warningMsg = '<span class="text-orange-500 ml-1 text-[10px]"><i class="fa-solid fa-triangle-exclamation"></i> 需全月滿$1000</span>';
                }
                if (k === 'imotion' && (c.spent + amt < 3800)) {
                    warningMsg = '<span class="text-orange-500 ml
